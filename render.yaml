# ============================================================================
# 🚀 Wend-Kabré SaaS — Blueprint Render (Infrastructure-as-Code)
# Déployer automatiquement :
#   • 1 Base PostgreSQL managée
#   • Service 1 : wend-kabre-backend  (Next.js App Router / Frontend + API)
#   • Service 2 : payment-service      (Node/Express + Prisma + Money Fusion)
#
# Utilisation: Render → New + → Blueprint → Choisir render.yaml
# ============================================================================

databases:
  - name: wendkabre-payment-db
    region: frankfurt
    plan: free
    databaseName: wend_kabre_payment
    user: wend_kabre_admin
    postgresMajorVersion: 16

services:
  # ==========================================================================
  # SERVICE 2 — Microservice de Paiement Money Fusion
  # ==========================================================================
  - type: web
    name: payment-service-wendkabre
    region: frankfurt
    plan: free
    runtime: node
    rootDir: payment-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_URL
        fromService:
          name: wend-kabre-backend
          type: web
          property: host
        options:
          expand: true
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wendkabre-payment-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MONEY_FUSION_API_URL
        value: https://api.moneyfusion.net/v1
      - key: MONEY_FUSION_TOKEN
        sync: false
      - key: MONEY_FUSION_API_KEY
        sync: false
      - key: MONEY_FUSION_WEBHOOK_SECRET
        sync: false
      - key: MONEY_FUSION_ALLOWED_IPS
        sync: false
      - key: PAYMENT_CURRENCY
        value: XOF

  # ==========================================================================
  # SERVICE 1 — Application Wend-Kabré Principale (Next.js)
  # ==========================================================================
  - type: web
    name: wend-kabre-backend
    region: frankfurt
    plan: starter
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/ping
    autoDeploy: yes
    pullRequestPreviewsEnabled: no
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        fromService:
          name: payment-service-wendkabre
          type: web
          property: host
        options:
          expand: true
      - key: JWT_SECRET
        fromService:
          name: payment-service-wendkabre
          type: web
          property: env
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: wendkabre-payment-db
          property: connectionString
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: SCRAPER_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
